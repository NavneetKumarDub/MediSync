
services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: medisync
    ports:
      - "5432:5432"
    volumes:
      # 1. Pointing exactly to your old Postgres data
      - medisyncserver_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: medisync_redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass medisync1234
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio
    container_name: medisync_minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      # 2. Pointing exactly to your old MinIO data
      - server_minio_data:/data

volumes:
  # Redis can create its own normally, no strict lock needed here
  redis_data:
  
  # 3. The Locks: Forcing Docker to use existing hard drives
  medisyncserver_postgres_data:
    external: true
    
  server_minio_data:
    external: true