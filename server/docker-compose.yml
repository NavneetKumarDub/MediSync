
services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: medisync
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  

  redis:
    image: redis:7-alpine
    container_name: medisync_redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass medisync1234
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: